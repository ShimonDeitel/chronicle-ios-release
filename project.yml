name: Chronicle
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Chronicle:
    type: application
    platform: iOS
    sources:
      - path: Chronicle
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.chronicle
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Chronicle/Info.plist
        CODE_SIGN_ENTITLEMENTS: Chronicle/Chronicle.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ChronicleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChronicleTests
      - path: Chronicle.storekit
    dependencies:
      - target: Chronicle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.chronicle.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Chronicle:
    build:
      targets:
        Chronicle: all
        ChronicleTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Chronicle.storekit
    test:
      config: Debug
      storeKitConfiguration: Chronicle.storekit
      targets:
        - ChronicleTests
    archive:
      config: Release
